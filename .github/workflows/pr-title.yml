name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      # Squash-merging makes the PR title the commit message on main, and release-please
      # reads that message to pick the version and write the changelog.
      - name: Check the PR title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|chore|ci|perf|build|revert|style)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must look like 'type(scope): description', for example 'fix: handle empty reply'. Got: $TITLE"
            exit 1
          fi
