name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install fish (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fish

      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Install fisher and fishtape
        shell: fish {0}
        run: |
          curl -sL "https://raw.githubusercontent.com/jorgebucaran/fisher/a04308be92daa6cfecdbb0ca58b1e8508664cff2/functions/fisher.fish" | source && fisher install jorgebucaran/fisher@4.4.8 jorgebucaran/fishtape@3.0.1

      - name: Run tests
        shell: fish {0}
        run: fishtape tests/*.test.fish
