name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install fish (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fish

      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        run: brew install fish

      - name: Install fisher and fishtape
        shell: fish {0}
        run: |
          curl -sL "https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish" | source && fisher install jorgebucaran/fisher jorgebucaran/fishtape

      - name: Run tests
        shell: fish {0}
        run: fishtape tests/*.test.fish
